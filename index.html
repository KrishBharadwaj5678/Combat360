<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Combat 360</title>

  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1c2407b26c61958baa93967b5412487cd94b290b/dist/aframe-master.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  <style>
    .arjs-loader {
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .spinner {
      border: 7px solid rgba(255, 255, 255, 0.3);
      border-top: 7px solid white;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body style="margin : 0px; overflow: hidden;">

  <div class="arjs-loader">
    <div class="spinner"></div>
  </div>

  <!-- a-frame scene -->
  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam;debugUIEnabled: false;"
  >
  
    <!-- F16D Fighter Aircraft -->
    <a-nft
      type="nft"
      url="./markers/F16D/F16D"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    >
      <a-entity
        gltf-model="./models/F16D/scene.gltf"
        scale="30 30 30"
        position="100 0 -120"
        rotation="0 -90 0"
      ></a-entity>
    </a-nft>

    <!-- T-90SM Battle Tank -->
    <a-nft
      type="nft"
      url="./markers/T-90SM/t90"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    >
      <a-entity
        gltf-model="./models/T-90SM/scene.gltf"
        scale="25 25 25"
        position="60 0 -80"
        rotation="0 90 0"
      ></a-entity>
    </a-nft>

    <!-- MIM104 Air Defense System: TODO -->
    <a-nft
      type="nft"
      url="./markers/MIM104/MIM104"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    >
      <a-entity
        gltf-model="./models/MIM104/scene.gltf"
        scale="2.3 2.3 2.3"
        position="10 0 -12"
        rotation="0 -180 0"
      ></a-entity>
    </a-nft>

    <!-- Apache Helicopter -->
    <a-nft
      type="nft"
      url="./markers/Apache64D/Apache"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    >
      <a-entity
        gltf-model="./models/Apache64D/scene.gltf"
        scale="120 120 120"
        position="50 0 -75"
        rotation="0 -180 0"
      ></a-entity>
    </a-nft>

    <!-- Anti Aircraft Drone System -->
    <a-nft
      type="nft"
      url="./markers/AntiAircraft/AntiAircraft"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    >
      <a-entity
        gltf-model="./models/AntiAircraft/scene.gltf"
        scale="26 26 26"
        position="75 0 -80"
        rotation="0 -90 0"
      ></a-entity>
    </a-nft>

    <!-- USS CVN-65 Aircraft Carrier -->
    <a-nft
      type="nft"
      url="./markers/CVN-65/CVN65"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    >
      <a-entity
        gltf-model="./models/CVN-65/scene.gltf"
        scale="0.6 0.6 0.6"
        position="40 0 -50"
        rotation="0 -180 0"
      ></a-entity>
    </a-nft>

    <!-- Bell Boeing V-22 Osprey Military Helicopter -->
    <a-nft
      type="nft"
      url="./markers/V22/V22"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    >
      <a-entity
        gltf-model="./models/V22/scene.gltf"
        scale="0.6 0.6 0.6"
        position="40 0 -50"
        rotation="0 -180 0"
      ></a-entity>
    </a-nft>

    <!-- Lighting -->
    <a-entity light="type: ambient; intensity: 2"></a-entity>
    <a-entity light="type: directional; intensity: 4" position="1 1 1"></a-entity>

    <!-- static camera that moves according to the device movemenents -->
    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
